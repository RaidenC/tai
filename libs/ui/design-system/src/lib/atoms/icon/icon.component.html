<svg
  [class]="iconClasses()"
  fill="none"
  stroke="currentColor"
  viewBox="0 0 24 24"
  [attr.aria-hidden]="decorative() ? 'true' : null"
  [attr.aria-label]="decorative() ? null : ariaLabel()"
  [attr.role]="decorative() ? null : 'img'"
>
  @switch (name()) {
    @case ('bell') {
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
    }
    @case ('chevron-up') {
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" />
    }
    @case ('chevron-down') {
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    }
    @case ('chevron-up-down') {
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4M16 15l-4 4-4-4" />
    }
    @case ('more-vertical') {
      <circle cx="12" cy="5" r="1.5" />
      <circle cx="12" cy="12" r="1.5" />
      <circle cx="12" cy="19" r="1.5" />
    }
    @case ('search') {
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15z" />
    }
    @case ('empty-state') {
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    }
  }
</svg>
