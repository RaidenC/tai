<button
  [type]="type()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-expanded]="ariaExpanded()"
  [attr.aria-controls]="ariaControls()"
  [attr.data-focus-target]="focusTarget()"
  [attr.data-testid]="testId() || null"
  [class]="buttonClasses()"
  (click)="onClick($event)"
>
  <ng-content></ng-content>
</button>
