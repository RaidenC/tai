<tai-button
  shape="circle"
  [iconOnly]="true"
  [ariaLabel]="accessibleLabel()"
  [ariaExpanded]="isOpen()"
  ariaControls="notification-panel"
  (pressed)="toggle()"
>
  <tai-icon name="bell" />

  @if (showBadge()) {
      <span
        class="unread-badge absolute -top-1 -right-1 flex h-5 min-w-5 items-center justify-center rounded-full border-2 border-white bg-red-600 px-1.5 text-xs font-semibold text-white"
      >
        {{ displayCount() }}
      </span>
  }

  @if (showConnectionIndicator()) {
    <span class="absolute right-1 bottom-1 w-2.5 h-2.5 border-2 border-white rounded-full connection-indicator" [class]="connectionState() === 'reconnecting' ? 'bg-amber-700' : 'bg-red-700'" aria-hidden="true"></span>
  }
</tai-button>
