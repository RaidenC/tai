<button
  class="toggle-button"
  type="button"
  (click)="toggle()"
  [attr.aria-label]="accessibleLabel()"
  [attr.aria-expanded]="isOpen()"
  aria-controls="notification-panel"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
    <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
  </svg>

  @if (showBadge()) {
    <span class="unread-badge">{{ displayCount() }}</span>
  }

  @if (showConnectionIndicator()) {
    <span class="absolute right-1 bottom-1 w-2.5 h-2.5 border-2 border-white rounded-full connection-indicator" [class]="connectionState() === 'reconnecting' ? 'bg-amber-700' : 'bg-red-700'" aria-hidden="true"></span>
  }
</button>
