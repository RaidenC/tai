@if (isOpen()()) {
   
   
  <div class="panel-overlay" (click)="close()" role="button" tabindex="0" (keydown.enter)="close()" (keydown.escape)="close()"></div>
   
  <div class="notification-panel">
    <div class="panel-header">
      <h3>Notifications</h3>
      <button class="close-btn" (click)="close()" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>

    <div class="search-box">
      <input
        type="text"
        placeholder="Search notifications..."
        [value]="searchText()()"
        (input)="onSearchChange($event)"
      />
    </div>

    <div class="filter-buttons">
      <button
        [class.active]="severityFilter()() === 'all'"
        (click)="setSeverity('all')"
      >All</button>
      <button
        [class.active]="severityFilter()() === 'critical'"
        (click)="setSeverity('critical')"
      >Critical</button>
      <button
        [class.active]="severityFilter()() === 'warning'"
        (click)="setSeverity('warning')"
      >Warning</button>
      <button
        [class.active]="severityFilter()() === 'info'"
        (click)="setSeverity('info')"
      >Info</button>
    </div>

    <div class="event-list">
      @for (event of filteredEvents(); track event.id) {
        <div class="event-item" [class]="getSeverityClass(event.severity)">
          <div class="event-severity-bar"></div>
          <div class="event-content">
            <div class="event-action">{{ event.title }}</div>
            <div class="event-meta">
              <span class="event-time">{{ formatTime(event.timestamp) }}</span>
              @if (event.actor) {
                <span class="event-user">{{ event.actor }}</span>
              }
            </div>
          </div>
        </div>
      } @empty {
        <div class="empty-state">No notifications</div>
      }
    </div>
  </div>
}
